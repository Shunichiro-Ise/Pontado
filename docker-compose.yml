version: "3.9"

services:
  db:
    image: postgres:16
    container_name: pontado-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: pontado-backend
    command: ["npm", "run", "start:dev"]
    volumes:
      - ./backend:/usr/src/app
      - /usr/src/app/node_modules
    env_file:
      - .env
    environment:
      NODE_ENV: development
      DB_HOST: db
    ports:
      - "4000:3000"    # ホスト4000→コンテナ3000(Nest)
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: pontado-frontend
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]
    volumes:
      - ./frontend:/usr/src/app
      - /usr/src/app/node_modules
    env_file:
      - .env
    environment:
      NODE_ENV: development
      # ここで上書きもできるが .env で設定済みでもOK
      VITE_API_BASE_URL: http://localhost:4000
    ports:
      - "3000:5173"    # ホスト3000→コンテナ5173(Vite)
    depends_on:
      - backend

volumes:
  db-data: